name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Create a minimal .env so Next.js doesn't crash on missing vars during typecheck
      - name: Create stub env
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=https://stub.supabase.co" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=stub-key" >> .env.local

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck
